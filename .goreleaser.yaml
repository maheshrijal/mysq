version: 2

project_name: mysq

builds:
  - id: mysq
    main: ./cmd/mysq
    binary: mysq
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: mysq
    homepage: https://github.com/maheshrijal/mysq
    description: Find slow queries, blocked transactions, and MySQL performance problems
    binaries: [mysq]
    skip_upload: auto
    repository:
      owner: maheshrijal
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    commit_author:
      name: Mahesh Rijal
      email: 62394512+maheshrijal@users.noreply.github.com
    # Emit the structured hook directly; hooks.post.install generates deprecated postflight.
    # Escape Homebrew's runtime token through GoReleaser's template pass.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "{{ "{{staged_path}}" }}/mysq"]
        end
      end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
